<!doctype html><html><head><meta charset="utf-8"><title>the tower console</title>
<meta http-equiv="refresh" content="10">
<style>
@font-face{font-family:Plex;src:url(IBMPlexMono-Light.ttf);font-weight:300}
@font-face{font-family:Plex;src:url(IBMPlexMono-Regular.ttf);font-weight:400}
html,body{margin:0;height:100%;background:#000;color:#1D847E;font-family:Plex,monospace;font-weight:300;cursor:none;overflow:hidden}
#c{position:absolute;left:64px;bottom:64px;font-size:20px;line-height:1.7;white-space:pre}
.h{font-weight:400;color:#1D847E;letter-spacing:.04em}.d{opacity:.55}
</style><script charset="utf-8" src="status.js"></script></head><body><div id="c"></div>
<script>
var s=window.S||{};function L(k,v){return k.padEnd(10)+(v==null?'-':v)+'\n'}
document.getElementById('c').innerHTML='<span class="h">the tower</span>\n<span class="d">'+(s.os||'')+'</span>\n\n'+
L('gpu',s.gpu)+L('load',s.load)+L('temp',s.temp)+L('vram',s.vram)+'\n'+L('queue',s.queue)+L('last',s.last)+'\n<span class="d">'+(s.time||'')+'</span>';
</script></body></html>
